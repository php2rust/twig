[package]
name = "twig"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false
description = "Port of twig/twig: lexer, parser and runtime for a build-time Twig compiler"

[dependencies]
php-pcre = { workspace = true }
php-date = { workspace = true }
php-iconv = { workspace = true }
twox-hash = { version = "2.1.5", default-features = false, features = ["xxhash3_128"] }
php-value = { workspace = true }
symfony-deprecation-contracts = { path = "../deprecation-contracts" }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.154"

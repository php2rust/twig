[package]
name = "twig-integration"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false
description = "Twig's integration fixtures, compiled to Rust at build time and run against recorded PHP results"

[dependencies]
php-value = { workspace = true }
twig = { path = "../twig" }

[build-dependencies]
php-value = { workspace = true }
serde_json = "1.0.154"
symfony-deprecation-contracts = { path = "../deprecation-contracts" }
twig = { path = "../twig" }

[dev-dependencies]
serde_json = "1.0.154"
symfony-deprecation-contracts = { path = "../deprecation-contracts" }

[lints]
workspace = true
